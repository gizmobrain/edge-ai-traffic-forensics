server {
    listen 80;
    client_max_body_size 250M;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
    location /api/ {
        proxy_pass http://mediamtx:9997/;
    }
    location /playback/ {
        proxy_pass http://mediamtx:9996/;
    }
    location /control/ {
        proxy_pass http://ai-detector:8080/;
        proxy_set_header Host $host;
    }
}