services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
      - "9996:9996"
      - "9997:9997"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings

  ai-detector:
    build: ./ai-detector
    container_name: ai-detector
    restart: unless-stopped
    depends_on:
      - mediamtx
    environment:
      - SITE_ID=CTC_OFFICE_01
      - NOC_STREAM_URL=rtsp://192.168.3.203:8554/live
      - NOC_WEBHOOK=http://noc.addsoft.local
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./recordings:/recordings
      - ./mediamtx.yml:/app/mediamtx.yml:ro

  demo-wall:
    image: nginx:alpine
    container_name: demo-wall
    restart: unless-stopped
    ports:
      - "80:80"
      - "8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./demo-wall.html:/usr/share/nginx/html/index.html:ro
      - ./demo-wall.html:/usr/share/nginx/html/demo-wall.html:ro